<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101211"><title>Andy's desk clock</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#101211;--ink:#f3f5ef;--muted:#959e96;--line:#303632;--panel:#191e1b;--accent:#bde69b;--soft:#232d24}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--bg);color:var(--ink);font:16px 'Segoe UI',system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:5px}button{border:1px solid var(--line);background:transparent;border-radius:8px;min-height:48px;padding:0 20px}button:hover{background:var(--soft)}button:active{transform:translateY(1px)}.icon{width:48px;padding:0;font-size:22px}header{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:26px 36px}.actions{display:flex;gap:8px}.mode{display:flex;border:1px solid var(--line);border-radius:8px;padding:3px}.mode button{border:0;min-height:40px;padding:0 18px;font-size:14px;border-radius:5px}.mode button[aria-pressed=true]{background:var(--ink);color:var(--bg)}main{height:calc(100% - 102px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 28px 58px}.clock-wrap{width:min(100%,1080px);text-align:center}.eyebrow{color:var(--accent);font-size:12px;text-transform:uppercase;font-weight:600;margin:0 0 12px}.clock{white-space:nowrap;line-height:1.05;font-size:180px;font-weight:300;font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;gap:18px}.seconds{font-size:32px;color:var(--muted);font-weight:400;min-width:42px}.date{font-size:22px;color:var(--muted);margin:20px 0 36px}.dayline{max-width:440px;margin:auto}.dayline .track{height:2px;background:var(--line)}.dayline .fill{height:100%;background:var(--accent);width:0}.day-labels{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--muted);text-transform:uppercase}.dock{display:flex;gap:10px;margin-top:42px;justify-content:center}.dock button{font-size:14px;min-height:50px}.dock .primary{background:var(--soft);color:var(--accent);border-color:#43523d}.dock small{margin-left:10px;opacity:.65}.footer{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:36px;right:36px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;pointer-events:none}.footer span:last-child{font-variant-numeric:tabular-nums}.car main{height:calc(100% - 102px)}.car .seconds,.car .dayline,.car .dock,.car .footer,.car .eyebrow,.car .desk-action{display:none}.car .date{margin-bottom:0}.car .clock{font-weight:400}.light{color-scheme:light;--bg:#f3f5f0;--ink:#202821;--muted:#5f6c62;--line:#c9d1c8;--panel:#fff;--accent:#426828;--soft:#e2eadb}.night{--bg:#050605;--ink:#a6aaa2;--muted:#657065;--accent:#73876a;--panel:#0e110e;--line:#252b25;--soft:#182018}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:min(640px,calc(100% - 32px));max-height:calc(100dvh - 48px);padding:28px;overflow:auto}dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}h1,h2,p{margin-top:0}h2{font-size:22px;font-weight:500;margin-bottom:0}.sub{color:var(--muted);font-size:14px;line-height:1.6}.tenure-name{font-size:34px;font-weight:400;margin-bottom:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0;margin:24px 0;gap:12px}.stats strong{font-size:48px;font-weight:300;font-variant-numeric:tabular-nums;display:block}.stats span{font-size:12px;color:var(--muted)}.milestone{display:flex;justify-content:space-between;gap:20px;font-size:14px;margin:22px 0 12px}.progress{height:4px;background:var(--line)}.progress div{height:100%;background:var(--accent)}.tabs{display:flex;gap:8px;margin-bottom:24px}.tabs button[aria-selected=true]{background:var(--soft);color:var(--accent)}.tool[hidden]{display:none}.timer-value{font-size:64px;text-align:center;font-weight:300;font-variant-numeric:tabular-nums;margin:20px 0}.presets,.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.presets button{min-height:40px;font-size:13px}.controls{margin:20px 0}.controls .start{background:var(--accent);color:var(--bg);border-color:transparent}.custom{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:14px}input[type=number]{width:80px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:10px}textarea{width:100%;min-height:220px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:16px;line-height:1.6}.note-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.setting{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}.setting input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}.setting input[type=range]{width:150px;accent-color:var(--accent)}select{font:inherit;background:var(--bg);color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:5px}.notice{min-height:22px;color:var(--accent);font-size:13px;margin:14px 0 0}.blink{animation:done 1s ease-in-out infinite alternate}@keyframes done{to{color:var(--accent)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:600px){header{padding:18px 18px}.actions{gap:4px}.mode button{padding:0 12px}.icon{width:44px}main{padding:10px 18px 65px}.date{font-size:18px}.seconds{font-size:22px;min-width:30px}.clock{gap:8px}.dock{margin-top:30px}.footer{left:20px;right:20px;font-size:11px}.stats strong{font-size:38px}dialog{padding:22px}.tenure-name{font-size:28px}}@media(max-height:560px){header{padding:10px 24px}main{height:calc(100% - 68px);padding-bottom:30px}.eyebrow,.dayline,.footer{display:none}.date{margin:8px 0 12px;font-size:18px}.dock{margin-top:10px}.car main{height:calc(100% - 68px)}}
</style>
</head>
<body>
<header><div class="actions"><div class="mode" aria-label="Display mode"><button id="desk" aria-pressed="true">Desk</button><button id="car" aria-pressed="false">Car</button></div><button class="icon desk-action" id="full" title="Fullscreen" aria-label="Toggle fullscreen">&#x26F6;</button><button class="icon desk-action" data-open="settings" title="Display settings" aria-label="Display settings">&#x2699;</button></div></header>
<main><div class="clock-wrap"><p class="eyebrow" id="greeting">Good morning, Andy</p><div class="clock" role="timer" aria-label="Current time"><span id="time">00:00</span><span class="seconds" id="seconds">00</span></div><p class="date" id="date"></p><div class="dayline"><div class="track"><div class="fill" id="day-fill"></div></div><div class="day-labels"><span id="weekday"></span><span id="week"></span></div></div><div class="dock"><button class="primary" data-open="tenure">Service Tenure <small>&#8599;</small></button><button data-open="tools">Tools <small>+</small></button></div></div></main>
<div class="footer"><span>Claremont School</span><span id="timer-status">LOCAL TIME</span></div>
<dialog id="tenure"><div class="dialog-head"><h2>Service Tenure</h2><button class="icon" data-close title="Close" aria-label="Close Service Tenure">&#215;</button></div><p class="eyebrow">Claremont School</p><h1 class="tenure-name">Andy Clifton</h1><p class="sub">Head of IT &middot; Since 24 April 2005</p><div class="stats"><div><strong id="years">0</strong><span>YEARS</span></div><div><strong id="months">0</strong><span>MONTHS</span></div><div><strong id="days">0</strong><span>DAYS</span></div></div><p class="sub" id="total-days"></p><div class="milestone"><span id="next-year"></span><span id="until"></span></div><div class="progress"><div id="anniversary-progress"></div></div></dialog>
<dialog id="tools"><div class="dialog-head"><h2>A little extra</h2><button class="icon" data-close title="Close" aria-label="Close tools">&#215;</button></div><div class="tabs" role="tablist"><button id="timer-tab" role="tab" aria-selected="true" aria-controls="timer-tool">Timer</button><button id="notes-tab" role="tab" aria-selected="false" aria-controls="notes-tool">Scratchpad</button></div><section class="tool" id="timer-tool" role="tabpanel" aria-labelledby="timer-tab"><div class="presets"><button data-min="5">5 min</button><button data-min="15">15 min</button><button data-min="25">25 min</button><button data-min="45">45 min</button></div><label class="custom">Minutes <input id="minutes" type="number" min="1" max="240" value="25"></label><div class="timer-value" id="countdown">25:00</div><div class="controls"><button class="start" id="start">Start timer</button><button id="reset">Reset</button></div><p class="notice" id="timer-message" role="status"></p></section><section class="tool" id="notes-tool" role="tabpanel" aria-labelledby="notes-tab" hidden><textarea id="note" aria-label="Scratchpad" placeholder="Something to remember..."></textarea><div class="note-footer"><span class="sub" id="save-status">Saved on this device</span><button id="clear-note">Clear</button></div></section></dialog>
<dialog id="settings"><div class="dialog-head"><h2>Display</h2><button class="icon" data-close title="Close" aria-label="Close display settings">&#215;</button></div><label class="setting">Appearance <select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="night">Night</option></select></label><label class="setting">Show seconds <input id="show-seconds" type="checkbox" checked></label><label class="setting">24-hour clock <input id="format" type="checkbox" checked></label><label class="setting">Brightness <input id="brightness" type="range" min="30" max="100" value="100"></label><label class="setting">Keep screen awake <input id="awake" type="checkbox" checked></label><p class="notice" id="wake-status" role="status"></p></dialog>
<script>
if (location.protocol !== 'file:' && 'serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
const $=id=>document.getElementById(id);let prefs={theme:'dark',seconds:true,format:true,brightness:100,awake:true};try{Object.assign(prefs,JSON.parse(localStorage.getItem('still-display')||'{}'));$('note').value=localStorage.getItem('still-note')||''}catch{}
let car=false,lock=null,audio=null,remaining=1500000,end=0,running=false,finished=false;
function save(){try{localStorage.setItem('still-display',JSON.stringify(prefs))}catch{}}
function fitClock(){const maxHeight=innerHeight<560?innerHeight*.31:innerHeight*.25;const width=$('time').parentElement.parentElement.clientWidth-(!car&&prefs.seconds?65:8);$('time').parentElement.style.fontSize=Math.floor(Math.min(car?260:220,maxHeight,width/3.05))+'px'}
function apply(){document.body.classList.toggle('light',prefs.theme==='light');document.body.classList.toggle('night',prefs.theme==='night');document.body.classList.toggle('car',car);$('seconds').style.display=prefs.seconds&&!car?'':'none';document.body.style.filter='brightness('+prefs.brightness/100+')';$('theme').value=prefs.theme;$('show-seconds').checked=prefs.seconds;$('format').checked=prefs.format;$('brightness').value=prefs.brightness;$('awake').checked=prefs.awake;$('desk').setAttribute('aria-pressed',!car);$('car').setAttribute('aria-pressed',car);fitClock();tick()}
function setMode(value){car=value;apply()}
$('desk').onclick=()=>setMode(false);$('car').onclick=()=>setMode(true);window.addEventListener('resize',fitClock);
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>$(b.dataset.open).showModal());document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
$('theme').onchange=e=>{prefs.theme=e.target.value;save();apply()};$('show-seconds').onchange=e=>{prefs.seconds=e.target.checked;save();apply()};$('format').onchange=e=>{prefs.format=e.target.checked;save();apply()};$('brightness').oninput=e=>{prefs.brightness=+e.target.value;save();apply()};
async function wake(){if(!prefs.awake||document.hidden||lock)return;try{lock=await navigator.wakeLock.request('screen');$('wake-status').textContent='Screen awake';lock.addEventListener('release',()=>{lock=null;$('wake-status').textContent='Screen wake lock released'})}catch{$('wake-status').textContent='Screen wake lock unavailable in this browser.'}}
$('awake').onchange=async e=>{prefs.awake=e.target.checked;save();if(!prefs.awake){if(lock)await lock.release();$('wake-status').textContent='Using device sleep settings'}else wake()};document.addEventListener('pointerdown',()=>{wake();if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch{}}if(audio?.state==='suspended')audio.resume()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();tick()}});
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('settings').showModal();$('wake-status').textContent='Fullscreen is unavailable in this browser.'}};
function tenure(now){const start=new Date(2005,3,24);let y=now.getFullYear()-2005;if(now<new Date(now.getFullYear(),3,24))y--;let anniversary=new Date(2005+y,3,24),next=new Date(2006+y,3,24);let m=(now.getFullYear()-anniversary.getFullYear())*12+now.getMonth()-anniversary.getMonth();let anchor=new Date(anniversary.getFullYear(),3+m,24);if(anchor>now){m--;anchor=new Date(anniversary.getFullYear(),3+m,24)}const dayNumber=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000;const days=dayNumber(now)-dayNumber(anchor);$('years').textContent=y;$('months').textContent=m;$('days').textContent=days;$('total-days').textContent=(dayNumber(now)-dayNumber(start)).toLocaleString('en-GB')+' days of service';$('next-year').textContent=(y+1)+' years on 24 April';$('until').textContent=(dayNumber(next)-dayNumber(now))+' days to go';$('anniversary-progress').style.width=Math.max(0,Math.min(100,(now-anniversary)/(next-anniversary)*100))+'%'}
function duration(ms){let s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function alarm(){if(!audio)return;for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=660;g.gain.setValueAtTime(.15,audio.currentTime+i*.45);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+i*.45+.3);o.start(audio.currentTime+i*.45);o.stop(audio.currentTime+i*.45+.32)}}
function tick(){const n=new Date(),h=n.getHours();$('time').textContent=String(prefs.format?h:(h%12||12)).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');$('seconds').textContent=String(n.getSeconds()).padStart(2,'0');$('date').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+(!prefs.format?' / '+(h<12?'AM':'PM'):'');$('greeting').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', Andy';$('day-fill').style.width=((h*60+n.getMinutes())/1440*100)+'%';$('weekday').textContent=n.toLocaleDateString('en-GB',{weekday:'long'});$('week').textContent=n.toLocaleDateString('en-GB',{month:'long',year:'numeric'});tenure(n);if(running){remaining=Math.max(0,end-Date.now());if(!remaining){running=false;finished=true;$('start').textContent='Start again';$('timer-message').textContent='Time is up.';$('countdown').classList.add('blink');alarm();if(!car){document.querySelectorAll('dialog[open]').forEach(d=>d.close());$('tools').showModal();tab('timer')}}}$('countdown').textContent=duration(remaining);$('timer-status').textContent=finished?'TIMER FINISHED':running?'TIMER / '+duration(remaining):'LOCAL TIME'}
function resetTimer(){running=false;finished=false;remaining=Math.max(1,Math.min(240,+$('minutes').value||25))*60000;$('minutes').value=remaining/60000;$('start').textContent='Start timer';$('timer-message').textContent='';$('countdown').classList.remove('blink');tick()}
$('start').onclick=()=>{if(running){remaining=Math.max(0,end-Date.now());running=false;$('start').textContent='Resume'}else{if(finished)resetTimer();end=Date.now()+remaining;running=true;$('start').textContent='Pause';$('timer-message').textContent='Timer running'}tick()};$('reset').onclick=resetTimer;$('minutes').onchange=resetTimer;document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{$('minutes').value=b.dataset.min;resetTimer()});
function tab(which){for(const t of ['timer','notes']){$(t+'-tab').setAttribute('aria-selected',t===which);$(t+'-tool').hidden=t!==which}}$('timer-tab').onclick=()=>tab('timer');$('notes-tab').onclick=()=>tab('notes');$('note').oninput=()=>{try{localStorage.setItem('still-note',$('note').value);$('save-status').textContent='Saved on this device'}catch{$('save-status').textContent='Could not save on this device'}};$('clear-note').onclick=()=>{if(!$('note').value||confirm('Clear this scratchpad?')){$('note').value='';$('note').oninput()}};apply();setInterval(tick,250);
</script></body></html>
